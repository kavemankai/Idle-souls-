name: Render O1 environment additions

on:
  push:
    branches: [art/o1-environment-returns]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render SVG masters to runtime PNGs
        run: |
          npm ci
          python -m pip install -r tools/requirements.txt
          python tools/environment/export_o1_additions.py
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Keep editable and rendered art together
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/environments/runtime/wall-return-west.png assets/environments/runtime/wall-return-east.png assets/environments/runtime/doorway-jamb-west.png assets/environments/runtime/doorway-jamb-east.png assets/environments/runtime/endpoint-threshold.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "art(o1): rasterize five authored environment texture masters"
          git push origin "HEAD:${GITHUB_REF_NAME}"
