name: Render O1 combat feedback FX

on:
  push:
    branches: [art/o1-feedback-vfx]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rasterize authored effect masters and validate runtime
        run: |
          npm ci
          python -m pip install -r tools/requirements.txt
          npm run assets:vfx
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Commit effect PNGs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vfx/runtime/contact.png assets/vfx/runtime/stagger.png assets/vfx/runtime/dodge.png assets/vfx/runtime/block.png assets/vfx/runtime/parry.png assets/vfx/runtime/perfect.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "art(o1): export source combat feedback vectors"
          git push origin "HEAD:${GITHUB_REF_NAME}"
