name: Measure O1 asset coverage

on:
  push:
    branches: [qa/o1-asset-coverage]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Measure 600 authoritative O1 fights
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npx tsx tools/o1-asset-coverage.ts --seeds 100
      - name: Commit measured report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/o1_slice/ASSET_COVERAGE_REPORT.md docs/o1_slice/asset-coverage-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test(o1): record 600-fight missing sprite trace"
          git push origin "HEAD:${GITHUB_REF_NAME}"
