name: Audio Merge Typecheck

on:
  push:
    branches: [fix/audio-merge-typecheck]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Lint, typecheck, unit tests and build
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
